<!DOCTYPE html>
<html lang="ja" data-mode="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>NANONI / 24CLUB — 関係者限定</title>

<!-- ブラウザのタブ用。絵柄が画像なので SVG は置かず PNG だけにしてある -->
<link rel="icon" href="assets/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png">

<!-- iOS：ホーム画面に追加したときのアイコンと名前。
     apple-touch-icon（180×180 PNG）が無いと、iOS はページのスクショを縮小して使う。

     「アプリとして開く」指定（apple-mobile-web-app-capable / manifest の
     display:standalone）は付けない。付けると iOS がアプリ扱いにして、
     端末が暗い外観のときアイコンを勝手に暗く落としてしまう。
     NANONI_home（同じ白背景のアイコン）は付けていないので白いまま出ている。 -->
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-title" content="NANONI">

<!-- Android Chrome：アイコンと表示名は manifest 側 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)">

<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- ====================== ロック画面 ====================== -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-lock" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <p class="gate-brand">NANONI</p>
    <p class="gate-sub">24CLUB — 関係者限定 事業情報</p>

    <form id="gate-form" class="gate-form" autocomplete="off">
      <label class="visually-hidden" for="gate-input">パスワード</label>
      <input id="gate-input" type="password" placeholder="パスワードを入力"
             autocomplete="current-password" spellcheck="false" required>
      <button id="gate-btn" type="submit">閲覧する</button>
    </form>

    <p id="gate-msg" class="gate-msg" role="status" aria-live="polite"></p>

    <p class="gate-note">
      このページは NANONI / 24CLUB の関係者向け内部資料です。<br>
      原価・契約条件・請求情報を含みます。外部への共有はご遠慮ください。
    </p>
  </div>
</div>

<!-- ====================== 本体 ====================== -->
<div id="app" hidden>

  <header class="topbar">
    <button id="nav-toggle" type="button" aria-label="目次を開く">☰ 目次</button>
    <span class="topbar-brand">NANONI / 24CLUB</span>
  </header>

  <div class="scrim" id="scrim"></div>

  <div class="layout">
    <aside class="side" id="side">
      <div class="side-head">
        <p class="side-brand">NANONI</p>
        <span class="side-tag">関係者限定</span>
      </div>

      <div class="side-search">
        <input id="search" type="search" placeholder="キーワードで絞り込み（/）"
               spellcheck="false" autocomplete="off">
      </div>

      <nav aria-label="目次">
        <ul class="toc" id="toc"></ul>
      </nav>

      <div class="mode-switch">
        <a href="index.html" class="is-current" aria-current="page">通常版</a>
        <a href="simple.html">簡易版</a>
        <a href="schedule.html">スケジュール</a>
        <a href="lot2.html">第2ロット</a>
        <a href="chat.html">AIに質問</a>
      </div>

      <div class="side-foot">
        <button id="btn-print" type="button">印刷 / PDF</button>
        <button id="btn-lock" type="button">ロック</button>
      </div>
    </aside>

    <main class="main">
      <p class="filter-status" id="filter-status" role="status" aria-live="polite" hidden></p>
      <article class="doc" id="doc"></article>
    </main>
  </div>

  <button id="totop" type="button" aria-label="ページ上部へ戻る">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 15l-6-6-6 6"></path>
    </svg>
  </button>

</div>

<script src="payload.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
