<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NANONI">
  <!-- 背景：ライト/ダークどちらの壁紙でも沈まない深いウォームインク -->
  <rect width="512" height="512" fill="#2b2620"/>

  <!-- N のレターマーク（テキストではなくパスなので環境のフォントに依存しない） -->
  <g fill="#d9a961">
    <!-- 左の縦棒 -->
    <rect x="150" y="150" width="42" height="212" rx="6"/>
    <!-- 右の縦棒 -->
    <rect x="320" y="150" width="42" height="212" rx="6"/>
    <!-- 斜めの棒：左上から右下へ -->
    <path d="M150 150 h42 l170 212 h-42 z"/>
  </g>

  <!-- 下のアクセントバー（ラベルの帯を想起させる） -->
  <rect x="150" y="392" width="212" height="12" rx="6" fill="#8a6a34"/>
</svg>
