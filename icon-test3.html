<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アイコンの確認用 3</title>

<!-- icon-test2.html と「1文字だけ」違うページ。指定はまったく同じで、
     画像だけを、うちの南京錠のものに戻してある。
     （test2 は画像を替えると同時に manifest と favicon も外していたため、
       画像の差なのか指定の差なのかが分けられていなかった） -->
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="TEST3">

<style>
  body { margin:0; padding:32px; font-family:system-ui,sans-serif; line-height:1.8; color:#222; background:#fff; }
  h1 { font-size:20px; margin:0 0 16px; }
  p { max-width:34em; margin:0 0 14px; font-size:15px; }
  img { display:block; width:180px; height:180px; margin:20px 0; border:1px solid #ddd; border-radius:12px; }
</style>
</head>
<body>

<h1>アイコンの確認用ページ 3</h1>

<p>
  これをホーム画面に追加してください（名前は <strong>TEST3</strong> と出ます）。
  <strong>TEST2 と指定はまったく同じ</strong>で、画像だけを南京錠のものに戻してあります。
</p>

<img src="assets/apple-touch-icon.png" alt="apple-touch-icon.png">

<p>確認が済んだら、確認用のページと画像はすべて消します。</p>

</body>
</html>
