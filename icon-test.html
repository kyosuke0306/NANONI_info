<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アイコンの確認用</title>

<!-- NANONI_home と同じ4行だけ。ほかは何も置かない。
     このページは切り分けのためのもの。ホーム画面に追加して、
     アイコンがくっきり出るかどうかだけを見る。 -->
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="TEST">

<style>
  body { margin: 0; padding: 32px; font-family: system-ui, sans-serif;
         line-height: 1.8; color: #222; background: #fff; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  p { max-width: 34em; margin: 0 0 14px; font-size: 15px; }
  img { display: block; width: 180px; height: 180px; margin: 20px 0;
        border: 1px solid #ddd; border-radius: 12px; }
  small { color: #666; }
</style>
</head>
<body>

<h1>アイコンの確認用ページ</h1>

<p>
  このページを<strong>ホーム画面に追加</strong>して、アイコンがくっきり出るか
  ぼけるかを見てください。中身は空で、パスワードも script も入れていません。
  アイコンの指定だけが本番と同じです。
</p>

<p>下は、実際に使っている画像をそのまま貼ったものです。</p>
<img src="assets/apple-touch-icon.png" alt="apple-touch-icon.png">

<p><small>
  確認が済んだら、このページは消してかまいません。
</small></p>

</body>
</html>
